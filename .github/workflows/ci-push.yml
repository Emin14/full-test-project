name: Manual CI

on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependency 
        working-directory: frontend
        run: npm ci
      
      - name: Test 
      - working-directory: frontend
        run: npm test